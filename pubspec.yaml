name: luma
description: Panneau LED Luma — Flutter Android et iOS, ESP32 BLE et MAX7219.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: 5.4.2
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  shared_preferences: ^2.5.3
  reactive_ble_mobile: 5.4.2
  reactive_ble_platform_interface: 5.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
